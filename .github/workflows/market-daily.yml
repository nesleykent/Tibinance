# Daily market data: fetch what TibiaMarket added, then the same path every update takes (tools/sync_market.mjs):
# rebuild, archive-first projections, forecast evaluation, validation, one publication commit, a data release.
# TibiaMarket adds about one snapshot per world and day, between 14:00 and 17:00 UTC; this runs after that.
# A failure at any step commits and releases nothing; the last validated data stay live.
name: Market data sync

on:
  schedule:
    - cron: '40 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-writers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reports/tc-cycle/requirements.txt
      - run: pip install -r reports/tc-cycle/requirements.txt
      - name: Repository owner commit identity
        run: |
          git config --global user.name 'nesleykent'
          git config --global user.email 'nesleykent@icloud.com'
      - name: Population sources (access status; collected only where a source answers normally)
        run: node tools/economy/population/collect_gated.mjs
      - name: Fetch, rebuild, evaluate, validate, publish and release
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: python
        run: >
          node tools/sync_market.mjs --fetch --publish --release --dispatch
          --approver "GitHub Actions market sync (validated data release)"
          --with data/economy/population
          --message "Market data sync: TibiaMarket history, validated and archived"
