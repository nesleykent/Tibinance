# Reuse the existing token source and the validated market publication path.
name: Token and currency data sync
on:
  schedule:
    - cron: '20 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: data-writers
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reports/tc-cycle/requirements.txt
      - run: pip install -r reports/tc-cycle/requirements.txt
      - name: Repository owner commit identity
        run: |
          git config --global user.name 'nesleykent'
          git config --global user.email 'nesleykent@icloud.com'
      - name: Refresh verified TIB candles and ECB reference history
        run: |
          node tools/fetch_tibia_token.mjs
          node tools/build_tibia_token.mjs
          node tools/fetch_foreign_exchange.mjs
      - name: Validate and publish through the established market data release path
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: python
        run: >
          node tools/sync_market.mjs --publish --release --dispatch
          --approver "GitHub Actions token and currency sync (validated data release)"
          --with data/foreign-exchange
          --message "Market data sync: verified TIB candles and ECB reference rates"
